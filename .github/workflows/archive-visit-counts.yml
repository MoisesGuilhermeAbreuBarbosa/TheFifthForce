name: Archive visit counts

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-visit-counts
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read aggregate visit counters
        env:
          OPEN_FIELD_SITE_URL: https://anti-gravity-site-rev02.vercel.app
        run: node scripts/archive-visit-counts.mjs
      - name: Commit updated aggregate snapshot
        run: |
          if git diff --quiet -- public/research/visit-counts.json; then exit 0; fi
          git config user.name "open-field-visit-archive[bot]"
          git config user.email "open-field-visit-archive[bot]@users.noreply.github.com"
          git add public/research/visit-counts.json
          git commit -m "Archive aggregate landing-page visit counts"
          git push
